<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Sandstorm Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5ece1;
            margin: 0;
            padding: 20px;
            color: #4a3b32;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fcf8f2;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(139, 115, 85, 0.15);
            border: 1px solid #e3d1be;
        }
        .brand-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-img {
            width: 160px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(139, 115, 85, 0.2);
        }
        h1 {
            color: #c08a3e;
            margin: 0;
            font-size: 2.2rem;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #8c7355;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .status {
            text-align: center;
            font-style: italic;
            color: #a08568;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .privacy-badge {
            display: inline-block;
            background-color: #e6d5c3;
            color: #6e563b;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 14px 22px;
            font-size: 1.05rem;
            border: 2px solid #dcc7b1;
            border-radius: 10px;
            outline: none;
            background-color: #fffcf9;
            color: #4a3b32;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #c08a3e;
            box-shadow: 0 0 8px rgba(192, 138, 62, 0.2);
        }
        button {
            padding: 14px 30px;
            font-size: 1.05rem;
            background-color: #c08a3e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #a6732e;
        }
        .result-item {
            border-bottom: 1px solid #ebdccb;
            padding: 22px 0;
        }
        .result-url {
            font-size: 1.15rem;
            color: #a6732e;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .result-url:hover {
            text-decoration: underline;
        }
        .result-meta {
            font-size: 0.85rem;
            color: #8c7355;
            margin: 6px 0;
        }
        .result-snippet {
            font-size: 0.95rem;
            color: #5c4a3c;
            line-height: 1.6;
        }
        .highlight {
            background-color: #f7e1c1;
            color: #8c5b1b;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: bold;
        }
        .no-results {
            text-align: center;
            color: #8c7355;
            margin-top: 40px;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-section">
        <img src="logo.png" alt="Infinity Sandstorm Logo" class="logo-img" onerror="this.src='https://placeholder.com'">
        <h1>⏳ Infinity Sandstorm Search</h1>
        <div class="subtitle">Sandstorm Search Engine</div>
        <div class="privacy-badge">🔒 מוגן ברמת פרטיות מקסימלית (No-Tracking)</div>
    </div>
    
    <div class="status" id="status-text">מתחבר למאגר המבוזר...</div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="הקש ביטוי לחיפוש חסוי במדבר המידע..." autofocus>
        <button onclick="triggerSearch()">חפש</button>
    </div>

    <div id="results-container"></div>
</div>

<script>
    function updateStatusLoop() {
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                document.getElementById('status-text').innerText = `האינפיניטי סרק עד כה ${data.total_crawled} אתרים זמינים בענן.`;
            })
            .catch(() => {});
        setTimeout(updateStatusLoop, 3000);
    }
    updateStatusLoop();

    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') triggerSearch();
    });

    function escapeAndHighlight(text, query) {
        let dummy = document.createElement('div');
        dummy.textContent = text;
        let safeText = dummy.innerHTML;

        if (!query) return safeText;
        const words = query.split(/\s+/).filter(w => w.length > 0);
        
        words.forEach(word => {
            const safeWord = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(`(${safeWord})`, 'gi');
            safeText = safeText.replace(regex, '<span class="highlight">$1</span>');
        });
        
        return safeText;
    }

    function triggerSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;

        const container = document.getElementById('results-container');
        container.innerHTML = '<div class="no-results">מנתח נתונים מוצפנים...</div>';

        fetch(`/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                container.innerHTML = '';
                
                if (data.results.length === 0) {
                    container.innerHTML = '<div class="no-results">🏜️ סופת החול לא מצאה התאמות לביטוי המבוקש.</div>';
                    return;
                }

                data.results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    const secureSnippet = escapeAndHighlight(item.snippet, query);

                    div.innerHTML = `
                        <a class="result-url" href="${item.url}" target="_blank" rel="noopener noreferrer">🔗 ${item.url}</a>
                        <div class="result-meta">📊 מופעים בדף: <strong>${item.score}</strong></div>
                        <div class="result-snippet">${secureSnippet}</div>
                    `;
                    container.appendChild(div);
                });
            });
    }
</script>

</body>
</html>
